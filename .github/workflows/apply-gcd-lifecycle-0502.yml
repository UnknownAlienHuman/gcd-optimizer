name: Apply GCD lifecycle hardening 0.5.2

on:
  push:
    paths:
      - tools/apply_gcd_lifecycle_0502.py
      - .github/workflows/apply-gcd-lifecycle-0502.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gcd-lifecycle-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether migration is pending
        id: gate
        shell: bash
        run: |
          if [[ -f tools/apply_gcd_lifecycle_0502.py ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Migration already consumed.'
          fi
      - name: Install Lua 5.1
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Apply guarded migration
        if: steps.gate.outputs.run == 'true'
        run: python3 tools/apply_gcd_lifecycle_0502.py
      - name: Lua syntax
        if: steps.gate.outputs.run == 'true'
        run: find . -maxdepth 1 -name 'GCDOptimizer_*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Contract checks
        if: steps.gate.outputs.run == 'true'
        run: python3 tools/check_contract.py
      - name: Deterministic GCD harness
        if: steps.gate.outputs.run == 'true'
        run: lua5.1 tests/test_gcd_observation.lua
      - name: Core lifecycle harness
        if: steps.gate.outputs.run == 'true'
        run: lua5.1 tests/test_core_lifecycle.lua
      - name: Whitespace errors
        if: steps.gate.outputs.run == 'true'
        run: git diff --check
      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden GCD lifecycle boundaries"
          git push origin HEAD:main
